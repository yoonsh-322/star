<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAR 자소서 번역 챗봇 - 일상을 합격 자기소개서로</title>
  <meta name="description" content="취업 준비생의 일상과 알바 경험을 STAR 기법(상황-과제-행동-결과)의 전문 자기소개서와 맞춤 직무 키워드로 변환해 주는 AI 코치" />
  
  <!-- Pretendard Korean Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>

  <!-- React App in Single File -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESET_STORIES = [
      {
        icon: '☕',
        title: '카페 알바 컴플레인 응대',
        text: '오늘 카페 점심 피크타임에 주문이 엄청 밀렸는데 한 손님이 커피가 너무 미지근하고 늦게 나왔다고 언성을 높였다. 우선 당황하지 않고 진심으로 죄송하다고 사과드린 뒤, 주문서를 재확인해서 스팀 온도를 세심하게 맞춰 3분 만에 다시 만들어드렸다. 기다리시는 동안 드실 수 있는 미니 쿠키도 서비스로 챙겨드렸다. 손님이 나가실 때 오히려 화내서 미안하다며 고맙다고 하셨고, 사장님께도 피크타임용 주문 번호표 동선을 개선하자고 제안드렸다.',
      },
      {
        icon: '🏪',
        title: '편의점 유통기한 폐기율 절감',
        text: '편의점 야간 알바를 하는데 매주 삼각김밥과 샌드위치 폐기가 20개 이상씩 나와서 사장님 손해가 커 보였다. 손님들이 보통 진열대 깊은 곳이나 눈높이 위치만 집어가는 것을 발견하고, 유통기한 임박 상품을 계산대 바로 앞 눈에 띄는 "오늘의 추천 타임세일존"으로 재배치했다. 사장님께 말씀드려 폐기 3시간 전 20% 할인 태그를 붙여 팔았더니 폐기율이 기존 대비 거의 절반으로 줄었고, 사장님께 보너스 시급도 받았다.',
      },
      {
        icon: '💻',
        title: '반복 엑셀 업무 3시간→30분 단축',
        text: '방학 동안 사무 보조 알바를 했는데 매주 각 지점별 매출 데이터를 수기로 하나하나 취합해서 엑셀 보고서를 만드느라 3시간 넘게 걸렸다. 매번 오타도 나고 비효율적인 것 같아서 주말에 유튜브로 엑셀 VLOOKUP과 피벗테이블, 간단한 매크로를 독학했다. 지점별 파일만 넣으면 자동으로 합산되는 템플릿을 만들어 팀에 공유했더니 매주 3시간 걸리던 단순 반복 작업이 30분으로 줄어 팀장님께 큰 칭찬을 받았다.',
      },
      {
        icon: '👥',
        title: '조별과제 무임승차 갈등 조율',
        text: '전공 팀 프로젝트에서 4명 중 1명이 중간고사 이후 연락이 두절되고 자료 조사를 하나도 해오지 않았다. 다른 팀원들이 격분해서 이름에서 빼버리자고 했지만, 내가 먼저 개인적으로 연락해 전화를 걸어 사정을 들어봤다. 알고 보니 복수전공이라 과제 양이 과도해 포기 상태였던 것이었다. 그래서 과제 분량을 난이도별로 다시 쪼개어, 그 팀원에게는 디자인 및 PPT 템플릿 제작 역할을 부여해 참여를 유도했다. 결과적으로 팀원 모두가 만족하며 A+ 학점을 받았다.',
      },
    ];

    const TARGET_JOBS = [
      '전체 / 일반 (공통역량)',
      '기획 / 마케팅',
      '영업 / 고객서비스(CS)',
      'IT / 소프트웨어 개발',
      '경영지원 / 인사 / 총무',
      '유통 / 물류 / 생산관리',
    ];

    const TONES = [
      '신입 공채 표준체 (~습니다, 정중한 어조)',
      '주도적 실행·성과형 (문제해결 및 역량 강조)',
      '협업·소통형 (팀워크와 배려 강조)',
    ];

    const INITIAL_WELCOME_MESSAGE = {
      id: 'welcome-msg',
      role: 'assistant',
      content: '안녕하세요, 취업 준비생 여러분! 🎓\\n저는 여러분의 소소한 하루 일상이나 아르바이트 경험을 합격 자기소개서로 번역해 드리는 **STAR 자소서 번역 챗봇**입니다.\\n\\n카페, 편의점, 음식점, 물류, 사무보조 알바부터 조별과제, 동아리까지 오늘 겪은 일이나 기억에 남는 경험을 일기 쓰듯 편하게 말씀해 주세요!\\n\\n기업 채용 담당자가 가장 선호하는 **STAR 기법(상황-과제-행동-결과)**의 전문적인 자기소개서 문단과, 서류에 바로 엮어 쓸 수 있는 **핵심 직무 키워드 1~2가지**를 추천해 드릴게요. ✨',
      timestamp: Date.now(),
    };

    const STORAGE_KEY_MESSAGES = 'star_chat_messages_v2';
    const STORAGE_KEY_RECORDS = 'star_cover_letter_records_v2';

    function App() {
      const [activeTab, setActiveTab] = useState('chat');
      const [messages, setMessages] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_MESSAGES);
          return stored ? JSON.parse(stored) : [INITIAL_WELCOME_MESSAGE];
        } catch {
          return [INITIAL_WELCOME_MESSAGE];
        }
      });
      const [starRecords, setStarRecords] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY_RECORDS);
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState(null);

      // Input state
      const [inputText, setInputText] = useState('');
      const [targetJob, setTargetJob] = useState(TARGET_JOBS[0]);
      const [tone, setTone] = useState(TONES[0]);
      const [showOptions, setShowOptions] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [expandedRecordId, setExpandedRecordId] = useState(null);

      const textareaRef = useRef(null);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_MESSAGES, JSON.stringify(messages));
        } catch (e) {}
      }, [messages]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(starRecords));
        } catch (e) {}
      }, [starRecords]);

      useEffect(() => {
        if (activeTab === 'chat') {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isLoading, activeTab]);

      const handleSendMessage = async (textToSend, customJob = targetJob, customTone = tone) => {
        const queryText = (textToSend || inputText).trim();
        if (!queryText || isLoading) return;

        setErrorMessage(null);
        const userMsg = {
          id: `user-${Date.now()}`,
          role: 'user',
          content: queryText,
          timestamp: Date.now(),
        };

        setMessages((prev) => [...prev, userMsg]);
        setInputText('');
        setIsLoading(true);

        try {
          const historyContext = messages
            .filter((m) => m.id !== 'welcome-msg')
            .slice(-6)
            .map((m) => ({
              role: m.role,
              content: m.translation ? m.translation.replyText : m.content,
            }));

          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: queryText,
              history: historyContext,
              targetJob: customJob,
              tone: customTone,
            }),
          });

          const json = await res.json();
          if (!res.ok || !json.success) {
            throw new Error(json.error || '번역 중 오류가 발생했습니다.');
          }

          const botMsg = {
            id: `bot-${Date.now()}`,
            role: 'assistant',
            content: json.data.replyText,
            translation: json.data,
            timestamp: Date.now(),
          };

          setMessages((prev) => [...prev, botMsg]);

          // Archive into STAR records
          const newRec = {
            id: `rec-${Date.now()}`,
            originalStory: queryText,
            headline: json.data.headline,
            star: json.data.star,
            fullParagraph: json.data.fullParagraph,
            keywords: json.data.keywords,
            targetJob: customJob,
            tone: customTone,
            timestamp: Date.now(),
            isBookmarked: false,
          };
          setStarRecords((prev) => [newRec, ...prev]);
        } catch (err) {
          setErrorMessage(err.message || '서버 통신 실패');
        } finally {
          setIsLoading(false);
        }
      };

      const handleToggleBookmark = (id) => {
        setStarRecords((prev) =>
          prev.map((r) => (r.id === id ? { ...r, isBookmarked: !r.isBookmarked } : r))
        );
      };

      const handleDeleteRecord = (id) => {
        setStarRecords((prev) => prev.filter((r) => r.id !== id));
      };

      const savedRecords = starRecords.filter((r) => r.isBookmarked);

      const filteredRecords = starRecords.filter((rec) => {
        const matchesCategory =
          selectedCategory === '전체' ||
          (rec.targetJob && rec.targetJob.includes(selectedCategory.split(' ')[0]));
        const q = searchQuery.toLowerCase();
        const matchesSearch =
          !q ||
          rec.headline.toLowerCase().includes(q) ||
          rec.fullParagraph.toLowerCase().includes(q) ||
          rec.originalStory.toLowerCase().includes(q) ||
          rec.keywords.some((k) => k.keyword.toLowerCase().includes(q));
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col justify-between pb-16 md:pb-0">
          {/* Top Header */}
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-sm">
                ✨
              </div>
              <span className="font-bold text-slate-900 text-base">STAR 자소서 번역기</span>
            </div>

            {/* Desktop Tabs */}
            <nav className="hidden md:flex items-center gap-1 p-1 bg-slate-100 rounded-xl">
              <button
                onClick={() => setActiveTab('chat')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold ${
                  activeTab === 'chat' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'
                }`}
              >
                💬 채팅 번역
              </button>
              <button
                onClick={() => setActiveTab('records')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 ${
                  activeTab === 'records' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'
                }`}
              >
                📑 STAR 기록 ({starRecords.length})
              </button>
              <button
                onClick={() => setActiveTab('saved')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 ${
                  activeTab === 'saved' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'
                }`}
              >
                ⭐ 보관함 ({savedRecords.length})
              </button>
              <button
                onClick={() => setActiveTab('guide')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold ${
                  activeTab === 'guide' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'
                }`}
              >
                💡 가이드
              </button>
            </nav>

            <button
              onClick={() => {
                if (confirm('대화 내용을 초기화하시겠습니까? (STAR 자소서 기록은 안전하게 보존됩니다)')) {
                  setMessages([INITIAL_WELCOME_MESSAGE]);
                }
              }}
              className="p-2 text-slate-400 hover:text-slate-700"
              title="새 대화 시작"
            >
              🔄
            </button>
          </header>

          {/* Tab 1: Chat View */}
          {activeTab === 'chat' && (
            <div className="flex-1 flex flex-col justify-between">
              <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-4 sm:py-6">
                <div className="mb-4 p-4 rounded-2xl bg-white border border-slate-200 flex justify-between items-center">
                  <div>
                    <h2 className="text-sm font-bold text-slate-900">&quot;오늘 하루 어떤 경험을 하셨나요?&quot;</h2>
                    <p className="text-xs text-slate-500">소소한 일기도 STAR 기법의 전문 자소서로 즉시 번역됩니다.</p>
                  </div>
                  {starRecords.length > 0 && (
                    <button
                      onClick={() => setActiveTab('records')}
                      className="px-3 py-1.5 rounded-lg text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-200"
                    >
                      내 STAR 기록 {starRecords.length}건 보기 →
                    </button>
                  )}
                </div>

                <div className="space-y-4">
                  {messages.map((message) => {
                    const isUser = message.role === 'user';
                    if (isUser) {
                      return (
                        <div key={message.id} className="flex justify-end gap-2 my-3">
                          <div className="bg-indigo-600 text-white rounded-2xl rounded-tr-xs px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap max-w-[80%]">
                            {message.content}
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={message.id} className="flex gap-2.5 my-4">
                        <div className="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center shrink-0">
                          🤖
                        </div>
                        <div className="flex-1 max-w-[90%] space-y-2">
                          {message.translation ? (
                            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs p-5 space-y-4">
                              <div className="flex justify-between items-start border-b pb-3">
                                <div>
                                  <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
                                    추천 소제목
                                  </span>
                                  <h3 className="text-base font-bold text-slate-900 mt-1">{message.translation.headline}</h3>
                                </div>
                                <button
                                  onClick={() => {
                                    navigator.clipboard.writeText(`${message.translation.headline}\\n\\n${message.translation.fullParagraph}`);
                                    alert('자소서가 복사되었습니다!');
                                  }}
                                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white"
                                >
                                  📋 자소서 복사
                                </button>
                              </div>

                              <div className="p-4 bg-slate-50 rounded-xl text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-wrap">
                                {message.translation.fullParagraph}
                              </div>

                              <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs">
                                <div className="p-2.5 bg-sky-50 rounded-lg"><strong>🟦 S 상황:</strong> {message.translation.star.situation}</div>
                                <div className="p-2.5 bg-amber-50 rounded-lg"><strong>🟧 T 과제:</strong> {message.translation.star.task}</div>
                                <div className="p-2.5 bg-emerald-50 rounded-lg"><strong>🟩 A 행동:</strong> {message.translation.star.action}</div>
                                <div className="p-2.5 bg-purple-50 rounded-lg"><strong>🟪 R 성과:</strong> {message.translation.star.result}</div>
                              </div>

                              <div className="flex flex-wrap gap-1.5 pt-1">
                                {message.translation.keywords.map((k, i) => (
                                  <span key={i} className="text-[11px] bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded">
                                    #{k.keyword}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ) : (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 text-sm leading-relaxed whitespace-pre-wrap">
                              {message.content}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}

                  {isLoading && (
                    <div className="p-4 bg-white border border-slate-200 rounded-2xl text-xs font-semibold text-indigo-600">
                      경험을 STAR 구조와 직무 역량으로 번역하고 있어요...
                    </div>
                  )}

                  <div ref={messagesEndRef} />
                </div>
              </main>

              {/* Chat Input */}
              <div className="sticky bottom-0 bg-white border-t border-slate-200 p-3 sm:p-4">
                <div className="max-w-4xl mx-auto space-y-2">
                  <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
                    {PRESET_STORIES.map((p, idx) => (
                      <button
                        key={idx}
                        onClick={() => {
                          setInputText(p.text);
                          if (textareaRef.current) textareaRef.current.focus();
                        }}
                        className="shrink-0 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-700 text-xs border border-slate-200"
                      >
                        {p.icon} {p.title}
                      </button>
                    ))}
                  </div>

                  <div className="flex gap-2">
                    <textarea
                      ref={textareaRef}
                      rows={2}
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      placeholder="오늘 있었던 일이나 알바 경험을 편하게 일기처럼 적어보세요..."
                      className="w-full border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      onClick={() => handleSendMessage()}
                      disabled={!inputText.trim() || isLoading}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs shrink-0"
                    >
                      {isLoading ? '...' : '번역하기'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tab 2: STAR Records View */}
          {activeTab === 'records' && (
            <main className="max-w-4xl mx-auto px-4 py-6 space-y-4 w-full">
              <div className="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">내 STAR 자소서 기록</h2>
                  <p className="text-xs text-slate-500">번역된 모든 자소서 문단과 STAR 상세 분석 기록 ({starRecords.length}건)</p>
                </div>
                <button
                  onClick={() => setActiveTab('chat')}
                  className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold"
                >
                  새 일기 번역하기
                </button>
              </div>

              {/* Search */}
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="소제목, 본문, 직무 키워드 검색..."
                className="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm"
              />

              {/* Records List */}
              <div className="space-y-4">
                {filteredRecords.length === 0 ? (
                  <div className="bg-white p-12 text-center text-slate-400 text-sm rounded-2xl border">
                    기록된 STAR 자소서가 없습니다.
                  </div>
                ) : (
                  filteredRecords.map((r) => (
                    <article key={r.id} className="bg-white p-5 rounded-2xl border border-slate-200 space-y-3 shadow-xs">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">
                            {r.targetJob || '일반'}
                          </span>
                          <h3 className="font-bold text-slate-900 text-base mt-1">{r.headline}</h3>
                        </div>
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => handleToggleBookmark(r.id)}
                            className="p-1.5 text-xs text-amber-500 hover:bg-amber-50 rounded"
                          >
                            {r.isBookmarked ? '⭐ 보관됨' : '☆ 보관'}
                          </button>
                          <button
                            onClick={() => handleDeleteRecord(r.id)}
                            className="p-1.5 text-xs text-rose-500 hover:bg-rose-50 rounded"
                          >
                            삭제
                          </button>
                        </div>
                      </div>

                      {r.originalStory && (
                        <div className="p-2.5 bg-slate-50 rounded-lg text-xs text-slate-600 italic">
                          &quot;{r.originalStory}&quot;
                        </div>
                      )}

                      <p className="p-3 bg-slate-50 rounded-xl text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-wrap">
                        {r.fullParagraph}
                      </p>

                      <div className="flex justify-between items-center pt-2 border-t text-xs">
                        <button
                          onClick={() => setExpandedRecordId(expandedRecordId === r.id ? null : r.id)}
                          className="text-slate-600 font-semibold"
                        >
                          {expandedRecordId === r.id ? 'STAR 접기' : 'STAR 4단계 분석 보기'}
                        </button>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(`${r.headline}\\n\\n${r.fullParagraph}`);
                            alert('자소서가 복사되었습니다!');
                          }}
                          className="px-3 py-1 rounded-lg bg-indigo-600 text-white font-semibold"
                        >
                          복사
                        </button>
                      </div>

                      {expandedRecordId === r.id && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-2">
                          <div className="p-2 bg-sky-50 rounded"><strong>S 상황:</strong> {r.star.situation}</div>
                          <div className="p-2 bg-amber-50 rounded"><strong>T 과제:</strong> {r.star.task}</div>
                          <div className="p-2 bg-emerald-50 rounded"><strong>A 행동:</strong> {r.star.action}</div>
                          <div className="p-2 bg-purple-50 rounded"><strong>R 성과:</strong> {r.star.result}</div>
                        </div>
                      )}
                    </article>
                  ))
                )}
              </div>
            </main>
          )}

          {/* Tab 3: Saved Vault */}
          {activeTab === 'saved' && (
            <main className="max-w-4xl mx-auto px-4 py-6 space-y-4 w-full">
              <div className="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">즐겨찾기 보관함 ({savedRecords.length}건)</h2>
                  <p className="text-xs text-slate-500">서류 지원용으로 북마크해 둔 자소서 모음</p>
                </div>
              </div>
              <div className="space-y-4">
                {savedRecords.length === 0 ? (
                  <div className="bg-white p-12 text-center text-slate-400 text-sm rounded-2xl border">
                    보관함에 담긴 자소서가 없습니다.
                  </div>
                ) : (
                  savedRecords.map((r) => (
                    <article key={r.id} className="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
                      <h4 className="font-bold text-slate-900">{r.headline}</h4>
                      <p className="p-3 bg-slate-50 rounded text-xs sm:text-sm leading-relaxed">{r.fullParagraph}</p>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(`${r.headline}\\n\\n${r.fullParagraph}`);
                          alert('복사되었습니다!');
                        }}
                        className="px-3 py-1 rounded bg-indigo-600 text-white text-xs font-semibold"
                      >
                        복사하기
                      </button>
                    </article>
                  ))
                )}
              </div>
            </main>
          )}

          {/* Tab 4: Guide */}
          {activeTab === 'guide' && (
            <main className="max-w-4xl mx-auto px-4 py-6 space-y-4 w-full text-xs sm:text-sm text-slate-700">
              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
                <h2 className="text-lg font-bold text-slate-900">STAR 기법 작성 가이드</h2>
                <p className="text-slate-600">
                  대기업/공기업 채용 담당자가 지원자의 역량을 객관적으로 평가하기 위해 사용하는 4단계 구조화 기법입니다.
                </p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div className="bg-white p-4 rounded-xl border border-sky-100">
                  <div className="font-bold text-sky-800 mb-1">🟦 Situation (상황)</div>
                  <p className="text-slate-600">당시 근무 환경 및 배경을 객관적으로 제시합니다.</p>
                </div>
                <div className="bg-white p-4 rounded-xl border border-amber-100">
                  <div className="font-bold text-amber-800 mb-1">🟧 Task (과제/문제)</div>
                  <p className="text-slate-600">반드시 해결해야 했던 난관이나 목표를 서술합니다.</p>
                </div>
                <div className="bg-white p-4 rounded-xl border border-emerald-100">
                  <div className="font-bold text-emerald-800 mb-1">🟩 Action (주도적 행동 - 최고 배점)</div>
                  <p className="text-slate-600">본인이 주도적으로 시도한 문제 해결 방안과 소통 노력을 씁니다.</p>
                </div>
                <div className="bg-white p-4 rounded-xl border border-purple-100">
                  <div className="font-bold text-purple-800 mb-1">🟪 Result (결과/교훈)</div>
                  <p className="text-slate-600">정량적 수치와 성과, 그리고 얻은 인사이트를 마무리합니다.</p>
                </div>
              </div>
            </main>
          )}

          {/* Mobile Bottom Navigation Bar */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 grid grid-cols-4 h-16 items-center px-2 z-40">
            <button
              onClick={() => setActiveTab('chat')}
              className={`flex flex-col items-center justify-center text-[11px] font-medium ${
                activeTab === 'chat' ? 'text-indigo-600 font-bold' : 'text-slate-500'
              }`}
            >
              <span className="text-lg">💬</span>
              <span>채팅</span>
            </button>
            <button
              onClick={() => setActiveTab('records')}
              className={`flex flex-col items-center justify-center text-[11px] font-medium ${
                activeTab === 'records' ? 'text-indigo-600 font-bold' : 'text-slate-500'
              }`}
            >
              <span className="text-lg">📑</span>
              <span>기록 ({starRecords.length})</span>
            </button>
            <button
              onClick={() => setActiveTab('saved')}
              className={`flex flex-col items-center justify-center text-[11px] font-medium ${
                activeTab === 'saved' ? 'text-indigo-600 font-bold' : 'text-slate-500'
              }`}
            >
              <span className="text-lg">⭐</span>
              <span>보관함</span>
            </button>
            <button
              onClick={() => setActiveTab('guide')}
              className={`flex flex-col items-center justify-center text-[11px] font-medium ${
                activeTab === 'guide' ? 'text-indigo-600 font-bold' : 'text-slate-500'
              }`}
            >
              <span className="text-lg">💡</span>
              <span>가이드</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
